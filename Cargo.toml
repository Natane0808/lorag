[package]
name = "lorag"
version = "0.1.0"
edition = "2024"
description = "Fully local Agent RAG CLI powered by aha (in-process candle inference) + rig"
license = "MIT"

[lib]
name = "lorag"
path = "src/lib.rs"

[[bin]]
name = "lorag"
path = "src/main.rs"

[dependencies]
# ===== 核心：aha 推理 crate（path 依赖） =====
# 发布到 crates.io 时改 `aha = "0.2.6"`
aha = { path = "D:/workspace/rust/aha" }

# ===== 异步运行时 =====
# rt-multi-thread + macros 必备（spawn_blocking + #[tokio::main]）
# M1 起还要用 fs / process（ingest 读文件 + 备用）
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "process", "sync"] }

# ===== CLI =====
# derive 用于 clap 宏；ValueEnum trait 还要用来调 WhichModel::from_str
clap = { version = "4", features = ["derive"] }

# ===== 配置 =====
dotenvy = "0.15"

# ===== 序列化 =====
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ===== 错误 =====
anyhow = "1"
thiserror = "1"

# ===== 日志 =====
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# ===== 工具 =====
dirs = "6"  # 拿 ~/.aha/ 兼容 aha CLI 老用户；同 aha 自己的依赖版本

# ===== futures =====
# lancedb 通过传递依赖带进来，但我们要直接用 StreamExt::next() 读 vector_search 结果
futures = "0.3"

# ===== Agent / RAG 框架 =====
# M4 起：实现 rig 的 ProviderClient / CompletionClient / EmbeddingsClient / Provider
# rig-lancedb + lancedb 留到 M3+（ingest pipeline 才用）
# rig 是 rig-core 的 wrapper alias；这里用 0.40（最新）
rig = { version = "0.40", default-features = false }

# ===== M2: document loaders =====
pdf-extract = "0.7"
calamine = "0.26"
zip = "2"
quick-xml = "0.36"
pulldown-cmark = "0.12"

# ===== M3: vector store + sqlite + chunking =====
rig-lancedb = { version = "0.40" }
lancedb = "0.30"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
arrow-array = "58"
arrow-schema = "58"

# ===== M10: Web UI (axum HTTP server) =====
axum = { version = "0.8", features = ["json"] }
tower-http = { version = "0.6", features = ["cors"] }
tokio-stream = "0.1"
async-stream = "0.3"
rust-embed = "8"

# ===== Feature flags（passthrough 到 aha）=====
# 默认 CPU 推理（candle 默认 backend）。要 GPU 加速时选对应 feature。
#
# 用法：
#   cargo build --features cuda          # 启用 CUDA（需要 CUDA 12.x + nvcc + MSVC）
#   cargo build --features cuda,flash-attn  # CUDA + flash attention（更强但编译更慢）
#   cargo build --features metal         # macOS Metal 加速
#
# 编译前置：candle-cuda 第一次编译很慢（cudnn + cublas + cuda 全 link，10-20 分钟）；
# Windows 上要 Visual Studio Build Tools + CUDA Toolkit（nvcc 在 PATH）。
[features]
cuda = ["aha/cuda"]
flash-attn = ["aha/flash-attn"]
metal = ["aha/metal"]

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util"] }

# ──────────────────────────────────────────────────────────────────────
# Profile 调优
# ──────────────────────────────────────────────────────────────────────
# 开发期：默认 `cargo build`（debug）跑得更快 + 部分优化
[profile.dev]
opt-level = 1          # 比 0 快 ~3x；比 3 编译快 ~2x；LTO 关；debug info 完整
debug = true            # 行号 / 变量名都能在 panic 里看到

	# 发布：`cargo build --release` 给最终用户，binary 最小
[profile.release]
opt-level = "s"          # "s" = 体积优化（"z" 更激进但会慢一些）
lto = true               # fat LTO = 跨 crate 死代码消除最大化
codegen-units = 1        # 单单元 = 最佳优化
strip = true             # 移除全部符号表 + debug 信息
panic = "abort"          # 移除 unwinding 表（panic 无 backtrace，CLI 够用）
