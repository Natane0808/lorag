<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>lorag · 本地 RAG 助手</title>
<script>
  (function(){
    try {
      var t = localStorage.getItem('lorag-theme');
      if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    } catch(e){}
  })();
</script>
<style>
  :root {
    --bg: oklch(98% 0.004 240);
    --surface: oklch(100% 0 0);
    --surface-2: oklch(96% 0.005 240);
    --fg: oklch(20% 0.02 240);
    --fg-2: oklch(32% 0.018 240);
    --muted: oklch(50% 0.018 240);
    --muted-2: oklch(60% 0.015 240);
    --border: oklch(90% 0.006 240);
    --border-strong: oklch(82% 0.008 240);
    --accent: oklch(56% 0.12 170);
    --accent-fg: oklch(98% 0.02 170);
    --accent-tint: oklch(94% 0.04 170);
    --accent-tint-2: oklch(92% 0.05 170);
    --user-bubble: oklch(96% 0.006 200);
    --shadow-sm: 0 1px 2px oklch(20% 0.02 240 / 0.04);
    --shadow-md: 0 6px 20px oklch(20% 0.02 240 / 0.06);
    --font-display: 'Söhne', 'Avenir Next', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    --font-body: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
    --font-mono: ui-monospace, 'JetBrains Mono', 'IBM Plex Mono', Menlo, monospace;
  }
  [data-theme="dark"] {
    --bg: oklch(16% 0.012 240);
    --surface: oklch(20% 0.012 240);
    --surface-2: oklch(24% 0.014 240);
    --fg: oklch(96% 0.005 240);
    --fg-2: oklch(82% 0.01 240);
    --muted: oklch(68% 0.014 240);
    --muted-2: oklch(58% 0.014 240);
    --border: oklch(28% 0.012 240);
    --border-strong: oklch(36% 0.014 240);
    --accent: oklch(72% 0.13 170);
    --accent-fg: oklch(15% 0.08 170);
    --accent-tint: oklch(28% 0.06 170);
    --accent-tint-2: oklch(32% 0.07 170);
    --user-bubble: oklch(24% 0.014 240);
    --shadow-sm: 0 1px 2px oklch(0% 0 0 / 0.25);
    --shadow-md: 0 6px 20px oklch(0% 0 0 / 0.4);
  }

  /* Smooth theme switch — only on tokens, not on every interaction */
  html, body, .topbar, .history, .history-item, .history-new, .history-close,
  .history-foot, .history-scrim, .composer-inner, .prompt, .chip, .kb,
  .icon-btn, .send-btn, .meta-btn, .sources, .logo, .avatar,
  .brand-mark, .theme-btn, .msg-avatar, .user-bubble {
    transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: var(--font-body);
    background: var(--bg);
    color: var(--fg);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  button { font: inherit; color: inherit; }

  .app {
    display: grid;
    grid-template-columns: 252px minmax(0, 1fr);
    grid-template-rows: auto minmax(0, 1fr) auto;
    grid-template-areas:
      "top top"
      "history content"
      "history composer";
    height: 100vh;
    height: 100dvh;
    max-width: 1200px;
    margin: 0 auto;
    border-left: 1px solid var(--border);
    border-right: 1px solid var(--border);
    background: var(--bg);
  }

  /* Topbar */
  .topbar {
    grid-area: top;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
  }
  .history {
    grid-area: history;
    min-width: 0;
    min-height: 0;
    display: flex;
    flex-direction: column;
    background: var(--surface);
    border-right: 1px solid var(--border);
    overflow: hidden;
  }
  .history-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 18px 16px 14px;
    border-bottom: 1px solid var(--border);
  }
  .history-head-actions {
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .history-title {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .history-count {
    margin-top: 3px;
    color: var(--muted);
    font-family: var(--font-mono);
    font-size: 10px;
  }
  .history-new,
  .history-close {
    width: 32px;
    height: 32px;
    display: grid;
    place-items: center;
    border: 1px solid var(--border);
    border-radius: 9px;
    background: var(--bg);
    color: var(--muted);
    cursor: pointer;
    flex-shrink: 0;
  }
  .history-new:hover,
  .history-close:hover {
    color: var(--fg);
    border-color: var(--border-strong);
    background: var(--surface-2);
  }
  .history-close { display: none; }
  .history-list {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 12px 10px;
  }
  .history-list::-webkit-scrollbar { width: 6px; }
  .history-list::-webkit-scrollbar-thumb {
    background: var(--border-strong);
    border-radius: 4px;
  }
  .history-group-label {
    padding: 8px 8px 6px;
    color: var(--muted);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .history-group + .history-group { margin-top: 12px; }
  .history-item {
    width: 100%;
    display: block;
    text-align: left;
    border: 1px solid transparent;
    border-radius: 10px;
    background: transparent;
    color: var(--fg-2);
    padding: 10px 10px 9px;
    cursor: pointer;
    margin-bottom: 4px;
  }
  .history-item:hover {
    background: var(--surface-2);
    color: var(--fg);
  }
  .history-item.active {
    background: var(--accent-tint);
    color: var(--fg);
    border-color: color-mix(in oklch, var(--accent) 30%, transparent);
  }
  .history-item-main {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
  }
  .history-item-title {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 13px;
    font-weight: 500;
  }
  .history-item-time {
    color: var(--muted);
    font-family: var(--font-mono);
    font-size: 10px;
    flex-shrink: 0;
  }
  .history-item-preview {
    display: block;
    margin-top: 5px;
    color: var(--muted);
    font-size: 11px;
    line-height: 1.4;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .history-item.active .history-item-time,
  .history-item.active .history-item-preview { color: var(--accent); }
  .history-foot {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 16px 15px;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: 11px;
  }
  .history-foot-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    flex-shrink: 0;
  }
  .history-toggle { display: none; }
  .history-scrim { display: none; }
  .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .brand-mark {
    width: 30px; height: 30px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: var(--accent-tint);
    color: var(--accent);
    border-radius: 9px;
    flex-shrink: 0;
  }
  .brand-mark svg { display: block; }
  .brand-name {
    font-family: var(--font-display);
    font-size: 16px;
    font-weight: 600;
    color: var(--fg);
    letter-spacing: -0.015em;
  }
  .kb {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 5px 10px 5px 8px;
    border: 1px solid var(--border);
    border-radius: 999px;
    font-size: 12px;
    color: var(--fg-2);
    background: var(--surface);
  }
  .kb-dot {
    width: 7px; height: 7px;
    background: var(--accent);
    border-radius: 50%;
    box-shadow: 0 0 0 4px oklch(56% 0.12 170 / 0.18);
    flex-shrink: 0;
  }
  [data-theme="dark"] .kb-dot {
    box-shadow: 0 0 0 4px oklch(72% 0.13 170 / 0.22);
  }
  .kb-name { font-weight: 500; }
  .kb-sep { width: 1px; height: 12px; background: var(--border-strong); margin: 0 2px; }
  .kb-count { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }

  .actions { display: flex; align-items: center; gap: 6px; }
  .icon-btn {
    width: 36px; height: 36px;
    display: grid; place-items: center;
    background: transparent;
    border: 1px solid transparent;
    border-radius: 10px;
    color: var(--muted);
    cursor: pointer;
    transition: background-color 0.15s, color 0.15s, border-color 0.15s;
  }
  .icon-btn:hover {
    background: var(--surface-2);
    color: var(--fg);
  }
  .icon-btn:focus-visible {
    border-color: var(--accent);
    outline: none;
  }
  .avatar {
    width: 32px; height: 32px;
    background: oklch(72% 0.06 200);
    color: white;
    border-radius: 50%;
    display: grid; place-items: center;
    font-size: 12px; font-weight: 600;
    border: none;
    cursor: pointer;
    margin-left: 4px;
    letter-spacing: 0.02em;
  }
  [data-theme="dark"] .avatar { background: oklch(40% 0.08 200); }

  /* Theme toggle */
  .theme-btn .i-moon { display: none; }
  [data-theme="dark"] .theme-btn .i-sun { display: none; }
  [data-theme="dark"] .theme-btn .i-moon { display: block; }
  .theme-btn:active { transform: scale(0.94); }

  /* Content */
  .content {
    grid-area: content;
    min-height: 0;
    overflow-y: auto;
    padding: 24px;
    scroll-behavior: smooth;
  }
  .content::-webkit-scrollbar { width: 8px; }
  .content::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; }
  .content::-webkit-scrollbar-track { background: transparent; }
  .content-inner {
    width: 100%;
    max-width: 760px;
    margin: 0 auto;
    min-height: 100%;
    display: flex;
    flex-direction: column;
  }

  /* Welcome */
  .welcome {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 40px 0 24px;
  }
  .greeting {
    font-family: var(--font-display);
    font-size: clamp(28px, 4.5vw, 36px);
    font-weight: 600;
    letter-spacing: -0.02em;
    color: var(--fg);
    margin-bottom: 10px;
    line-height: 1.15;
  }
  .greeting-sub {
    color: var(--muted);
    font-size: 15px;
    margin-bottom: 36px;
    line-height: 1.5;
  }
  .prompts {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .prompt {
    text-align: left;
    padding: 16px 18px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    cursor: pointer;
    color: var(--fg);
    transition: background-color 0.15s, border-color 0.15s, transform 0.15s;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .prompt:hover {
    border-color: var(--accent);
    background: var(--accent-tint);
    transform: translateY(-1px);
  }
  .prompt-label { font-weight: 500; font-size: 14px; color: var(--fg); }
  .prompt-hint { font-size: 12px; color: var(--muted); line-height: 1.4; }

  .welcome-foot {
    margin-top: 24px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .chip {
    padding: 5px 10px;
    border: 1px solid var(--border);
    border-radius: 999px;
    font-size: 12px;
    color: var(--muted);
    background: var(--surface);
  }

  /* Messages */
  .messages {
    display: flex;
    flex-direction: column;
    gap: 28px;
    padding: 32px 0 24px;
  }
  .msg {
    display: flex;
    gap: 12px;
    max-width: 88%;
  }
  .msg.user {
    align-self: flex-end;
    flex-direction: row-reverse;
  }
  .msg-avatar {
    width: 30px; height: 30px;
    border-radius: 9px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .msg.user .msg-avatar {
    background: oklch(72% 0.06 200);
    border-radius: 50%;
    font-size: 12px;
    font-weight: 600;
    color: white;
  }
  [data-theme="dark"] .msg.user .msg-avatar { background: oklch(40% 0.08 200); }
  .msg.ai .msg-avatar {
    background: var(--accent-tint);
    color: var(--accent);
  }
  .msg.ai .msg-avatar svg { display: block; }
  .msg-body { flex: 1; min-width: 0; }
  .msg-text {
    font-size: 15px;
    line-height: 1.65;
    color: var(--fg);
    white-space: normal;
    word-wrap: break-word;
  }
  .msg-text strong { font-weight: 600; }
  .msg.user .msg-text {
    background: var(--user-bubble);
    padding: 12px 16px;
    border-radius: 14px 14px 4px 14px;
    display: inline-block;
  }
  .msg-meta {
    display: flex;
    align-items: center;
    gap: 4px;
    margin-top: 10px;
  }
  .sources {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 4px 10px;
    background: var(--accent-tint);
    color: var(--accent);
    border: 1px solid transparent;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: background-color 0.15s, border-color 0.15s;
  }
  .sources:hover {
    background: var(--accent-tint-2);
    border-color: var(--accent);
  }
  .meta-btn {
    width: 28px; height: 28px;
    display: grid; place-items: center;
    background: transparent;
    border: 1px solid transparent;
    color: var(--muted);
    cursor: pointer;
    border-radius: 8px;
    transition: background-color 0.15s, color 0.15s;
  }
  .meta-btn:hover {
    background: var(--surface-2);
    color: var(--fg);
  }
  .meta-btn.on {
    color: var(--accent);
    background: var(--accent-tint);
  }

  /* Typing */
  .typing {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 4px 0;
  }
  .typing span {
    width: 7px; height: 7px;
    background: var(--muted);
    border-radius: 50%;
    animation: typing 1.4s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: 0.18s; }
  .typing span:nth-child(3) { animation-delay: 0.36s; }
  @keyframes typing {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.35; }
    30% { transform: translateY(-5px); opacity: 1; }
  }

  /* Composer */
  .composer {
    grid-area: composer;
    padding: 14px 24px 18px;
    background: var(--bg);
  }
  .composer-inner {
    max-width: 760px;
    margin: 0 auto;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 10px 10px 10px 16px;
    display: flex;
    align-items: flex-end;
    gap: 8px;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .composer-inner:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 4px oklch(56% 0.12 170 / 0.13);
  }
  [data-theme="dark"] .composer-inner:focus-within {
    box-shadow: 0 0 0 4px oklch(72% 0.13 170 / 0.18);
  }
  .composer textarea {
    flex: 1;
    border: none;
    outline: none;
    resize: none;
    background: transparent;
    font: inherit;
    font-size: 15px;
    color: var(--fg);
    line-height: 1.5;
    padding: 7px 0;
    max-height: 180px;
    overflow-y: auto;
    font-family: inherit;
  }
  .composer textarea::placeholder { color: var(--muted-2); }
  .composer-buttons { display: flex; gap: 4px; align-items: center; flex-shrink: 0; }
  .send-btn {
    width: 36px; height: 36px;
    background: var(--accent);
    color: var(--accent-fg);
    border-radius: 10px;
    border: none;
    cursor: pointer;
    display: grid; place-items: center;
    transition: opacity 0.15s, transform 0.12s, background-color 0.15s, color 0.15s;
  }
  .send-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .send-btn:not(:disabled):hover { transform: scale(1.05); }
  .send-btn.stop {
    background: var(--surface-2);
    color: var(--fg);
    border: 1px solid var(--border-strong);
  }
  .composer-hint {
    text-align: center;
    font-size: 11px;
    color: var(--muted);
    margin-top: 9px;
    max-width: 760px;
    margin-left: auto;
    margin-right: auto;
    font-family: var(--font-mono);
    letter-spacing: 0.02em;
  }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 96px;
    left: 50%;
    transform: translateX(-50%) translateY(14px);
    background: var(--fg);
    color: var(--bg);
    padding: 10px 16px;
    border-radius: 10px;
    font-size: 13px;
    opacity: 0;
    transition: opacity 0.25s, transform 0.25s;
    pointer-events: none;
    z-index: 100;
    box-shadow: var(--shadow-md);
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* Responsive */
  @media (max-width: 860px) {
    .app {
      grid-template-columns: minmax(0, 1fr);
      grid-template-areas:
        "top"
        "content"
        "composer";
      max-width: none;
    }
    .history {
      position: fixed;
      inset: 0 auto 0 0;
      width: 280px;
      max-width: 86vw;
      z-index: 60;
      transform: translateX(-100%);
      transition: transform 0.24s ease, box-shadow 0.24s ease;
      box-shadow: none;
    }
    .app.history-open .history {
      transform: translateX(0);
      box-shadow: 0 0 0 100vmax oklch(0% 0 0 / 0.28);
    }
    .history-toggle { display: grid; }
    .history-close { display: grid; }
    .history-scrim {
      display: block;
      position: fixed;
      inset: 0;
      background: transparent;
      border: 0;
      padding: 0;
      z-index: 55;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, background-color 0.2s ease;
      cursor: default;
    }
    .app.history-open .history-scrim {
      opacity: 1;
      pointer-events: auto;
      background: oklch(0% 0 0 / 0.28);
    }
  }
  @media (max-width: 720px) {
    .topbar { padding: 10px 14px; }
    .kb { display: none; }
    .content { padding: 16px; }
    .composer { padding: 10px 12px 16px; }
    .prompts { grid-template-columns: 1fr; }
    .greeting { font-size: 26px; }
    .brand-name { display: none; }
    .welcome { padding: 24px 0 16px; }
  }
  @media (max-width: 420px) {
    .msg { max-width: 95%; }
    .greeting-sub { font-size: 14px; }
  }
</style>
</head>
<body>
<button id="historyScrim" class="history-scrim" aria-label="关闭历史栏"></button>
<div class="app" id="app">
  <aside class="history" aria-label="对话历史">
    <div class="history-head">
      <div>
        <div class="history-title">对话</div>
        <div class="history-count" id="historyCount">8 条</div>
      </div>
      <div class="history-head-actions">
        <button class="history-new" id="newBtnSide" title="新建对话" aria-label="新建对话">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
        <button class="history-close" id="historyClose" title="关闭历史栏" aria-label="关闭历史栏">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
    </div>
    <div class="history-list" id="historyList">
      <div class="history-group">
        <div class="history-group-label">今天</div>
        <button class="history-item" data-conv="0">
          <span class="history-item-main">
            <span class="history-item-title">PDF 检索质量优化</span>
            <span class="history-item-time">11:24</span>
          </span>
          <span class="history-item-preview">重排算法的关键参数应该是？</span>
        </button>
        <button class="history-item" data-conv="1">
          <span class="history-item-main">
            <span class="history-item-title">合同里的付款条款</span>
            <span class="history-item-time">10:02</span>
          </span>
          <span class="history-item-preview">第 12 条和第 22 条怎么对得上？</span>
        </button>
        <button class="history-item" data-conv="2">
          <span class="history-item-main">
            <span class="history-item-title">产品笔记 A vs B</span>
            <span class="history-item-time">09:31</span>
          </span>
          <span class="history-item-preview">目标用户差异在哪里？</span>
        </button>
      </div>
      <div class="history-group">
        <div class="history-group-label">昨天</div>
        <button class="history-item" data-conv="3">
          <span class="history-item-main">
            <span class="history-item-title">把资料变成 5 道测验</span>
            <span class="history-item-time">22:14</span>
          </span>
          <span class="history-item-preview">要含答案和解析</span>
        </button>
        <button class="history-item" data-conv="4">
          <span class="history-item-main">
            <span class="history-item-title">本地索引重建步骤</span>
            <span class="history-item-time">18:48</span>
          </span>
          <span class="history-item-preview">加新文档后要不要手动触发？</span>
        </button>
      </div>
      <div class="history-group">
        <div class="history-group-label">本周早些时候</div>
        <button class="history-item" data-conv="5">
          <span class="history-item-main">
            <span class="history-item-title">RAG 评测脚本</span>
            <span class="history-item-time">周一</span>
          </span>
          <span class="history-item-preview">跑完大约 12 分钟</span>
        </button>
        <button class="history-item" data-conv="6">
          <span class="history-item-main">
            <span class="history-item-title">余弦阈值建议</span>
            <span class="history-item-time">周一</span>
          </span>
          <span class="history-item-preview">短查询和长查询要分开调</span>
        </button>
        <button class="history-item" data-conv="7">
          <span class="history-item-main">
            <span class="history-item-title">重排模型选型</span>
            <span class="history-item-time">周日</span>
          </span>
          <span class="history-item-preview">bge-reranker-base 够用吗？</span>
        </button>
      </div>
    </div>
    <div class="history-foot">
      <span class="history-foot-dot"></span>
      <span>仅本地 · 不上传</span>
    </div>
  </aside>
  <header class="topbar">
    <div class="brand">
      <button class="icon-btn history-toggle" id="historyToggle" aria-label="打开历史栏" title="对话历史">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2.5" y="3" width="19" height="18" rx="5"/>
          <path d="M7 9.5h10M7 13h7M7 16.5h5" opacity="0.45"/>
          <circle cx="17.5" cy="17.5" r="2.6" fill="currentColor" stroke="none"/>
        </svg>
      </span>
      <span class="brand-name">lorag</span>
      <span class="kb">
        <span class="kb-dot"></span>
        <span class="kb-name">本地</span>
        <span class="kb-sep"></span>
        <span class="kb-count">3 文档</span>
      </span>
    </div>
    <div class="actions">
      <button class="icon-btn" id="newBtn" aria-label="新建对话" title="新建对话">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
      <button class="icon-btn theme-btn" id="themeToggle" aria-label="切换主题" title="切换浅色 / 深色">
        <svg class="i-sun" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3.8" fill="currentColor" stroke="none"/>
          <path d="M12 2.5v2.4M12 19.1v2.4M2.5 12h2.4M19.1 12h2.4M5.1 5.1l1.7 1.7M17.2 17.2l1.7 1.7M5.1 18.9l1.7-1.7M17.2 6.8l1.7-1.7"/>
        </svg>
        <svg class="i-moon" viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true">
          <path d="M20.5 14.8A8.3 8.3 0 0 1 9.2 3.5a.7.7 0 0 0-.95-.85 9 9 0 1 0 13.1 13.1.7.7 0 0 0-.85-.95z"/>
        </svg>
      </button>
      <button class="avatar" aria-label="我">M</button>
    </div>
  </header>

  <section class="content" id="scroll">
    <div class="content-inner">
      <div id="welcome" class="welcome">
        <h1 class="greeting">问点什么</h1>
        <p class="greeting-sub">lorag 在本地跑 — 你的文件不会离开这台机器</p>
        <div class="prompts">
          <button class="prompt" data-q="帮我总结这份 PDF 的要点">
            <span class="prompt-label">总结一份长 PDF</span>
            <span class="prompt-hint">先抓大纲，再做摘要</span>
          </button>
          <button class="prompt" data-q="在合同文档里查找关于付款的条款">
            <span class="prompt-label">查找"付款"相关条款</span>
            <span class="prompt-hint">带原句引用</span>
          </button>
          <button class="prompt" data-q="对比产品笔记 A 和 B 的差异">
            <span class="prompt-label">对比两份笔记</span>
            <span class="prompt-hint">逐节对照差异</span>
          </button>
          <button class="prompt" data-q="根据这段资料生成 5 道测验题">
            <span class="prompt-label">把资料变成测验</span>
            <span class="prompt-hint">含答案与解析</span>
          </button>
        </div>
        <div class="welcome-foot">
          <span class="chip">仅本地 · 索引 3 个文档</span>
          <span class="chip">引用片段可点开查看</span>
          <span class="chip">主题可在右上角切换</span>
        </div>
      </div>

      <div id="messages" class="messages" hidden></div>
    </div>
  </section>

  <footer class="composer">
    <div class="composer-inner">
      <textarea id="input" placeholder="问任何事…" rows="1" aria-label="输入问题"></textarea>
      <div class="composer-buttons">
        <button class="icon-btn" id="attachBtn" aria-label="附加文件" title="附加文件 / 重建索引">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
        </button>
        <button class="send-btn" id="sendBtn" disabled aria-label="发送">
          <svg id="sendIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
        </button>
      </div>
    </div>
    <div class="composer-hint">⏎ 发送 &nbsp;·&nbsp; ⇧⏎ 换行</div>
  </footer>
</div>
<div id="toast" class="toast"></div>

<script>
(function () {
  /* Theme toggle */
  const root = document.documentElement;
  const themeBtn = document.getElementById('themeToggle');
  const setTheme = (t) => {
    root.setAttribute('data-theme', t);
    try { localStorage.setItem('lorag-theme', t); } catch(e){}
    themeBtn.setAttribute('aria-label', t === 'dark' ? '切换到浅色' : '切换到深色');
  };
  setTheme(root.getAttribute('data-theme') || 'light');
  themeBtn.addEventListener('click', () => {
    setTheme(root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  });

  /* Chat */
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('sendBtn');
  const attachBtn = document.getElementById('attachBtn');
  const newBtn = document.getElementById('newBtn');
  const welcome = document.getElementById('welcome');
  const messages = document.getElementById('messages');
  const scroll = document.getElementById('scroll');
  const toast = document.getElementById('toast');
  const sendIcon = document.getElementById('sendIcon');
  const newBtnSide = document.getElementById('newBtnSide');
  const historyList = document.getElementById('historyList');
  const historyCount = document.getElementById('historyCount');
  const historyToggle = document.getElementById('historyToggle');
  const historyClose = document.getElementById('historyClose');
  const historyScrim = document.getElementById('historyScrim');
  const appEl = document.getElementById('app');

  const SEND_ICON = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>';
  const STOP_ICON = '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>';
  const AI_AVATAR = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="4"/><path d="M7 10h10M7 13h7M7 16h5" opacity="0.45"/><circle cx="16" cy="16" r="2" fill="currentColor" stroke="none"/></svg>';

  const RESPONSES = {
    summary: {
      text: '好的，这篇 32 页的 PDF 我看到了三个要点：\n\n**1. 第一章**定义了项目的核心目标 — 把检索质量作为唯一指标。\n\n**2. 第三章**列出了四类失败的检索模式，含两个具体反例。\n\n**3. 第七章**给出了一个可复用的评测脚本，跑完约 12 分钟。\n\n需要我把哪一章展开讲讲？',
      sources: 3
    },
    search: {
      text: '找到了三个相关条款：\n\n**第 12 条 — 付款时间**\n签收之日起 30 日内付清全款，延期按 0.05% / 日计违约金。\n\n**第 18 条 — 付款方式**\n对公转账，不接受现金。\n\n**第 22 条 — 退订**\n开票后 7 日内可全额退订。',
      sources: 3
    },
    compare: {
      text: '两份笔记的差异主要在三处：\n\n• **目标用户**：A 写"企业内部研发"，B 写"独立开发者 + 小团队"\n\n• **定价**：A 按席位 / 月，B 按用量计费\n\n• **技术栈**：A 强调 TypeScript，B 强调 Python + Rust\n\n其余 14 个段落基本一致。',
      sources: 4
    },
    quiz: {
      text: '好，基于这段资料生成了 5 道题，含答案和解析：\n\n1. **Q**: RAG 的核心组件？ **A**: 检索器 + 生成器。\n\n2. **Q**: 为什么要重排检索结果？\n\n3. **Q**: 向量检索的余弦阈值建议？\n\n4. **Q**: 引用片段的最大长度？\n\n5. **Q**: 离线评测的最小语料规模？\n\n要把完整题目输出吗？',
      sources: 2
    },
    default: {
      text: '我看完你的知识库，结合三个最相关的片段给你回答：\n\n这件事的关键是你想达成什么 —— 我列了两种最常见的解法，各有取舍。先告诉我你的主要目标，我可以帮你收窄选择。',
      sources: 3
    }
  };

  const pickResponse = (text) => {
    const t = text.toLowerCase();
    if (t.includes('总结') || t.includes('pdf') || t.includes('要点') || t.includes('摘要')) return RESPONSES.summary;
    if (t.includes('查') || t.includes('条款') || t.includes('付款') || t.includes('合同')) return RESPONSES.search;
    if (t.includes('对比') || t.includes('差异')) return RESPONSES.compare;
    if (t.includes('测验') || t.includes('题')) return RESPONSES.quiz;
    return RESPONSES.default;
  };

  const autoGrow = () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 180) + 'px';
  };

  const escape = (s) => s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'})[c]);
  const formatText = (s) => escape(s)
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\n/g, '<br>');

  const scrollBottom = () => {
    requestAnimationFrame(() => { scroll.scrollTop = scroll.scrollHeight; });
  };

  const showToast = (msg) => {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => toast.classList.remove('show'), 1800);
  };

  const appendUser = (text) => {
    const div = document.createElement('div');
    div.className = 'msg user';
    div.innerHTML = '<div class="msg-avatar">M</div><div class="msg-body"><div class="msg-text"></div></div>';
    div.querySelector('.msg-text').textContent = text;
    messages.appendChild(div);
    scrollBottom();
  };

  const appendAI = (resp) => {
    const div = document.createElement('div');
    div.className = 'msg ai';
    div.innerHTML = `
      <div class="msg-avatar">${AI_AVATAR}</div>
      <div class="msg-body">
        <div class="msg-text">${formatText(resp.text)}</div>
        <div class="msg-meta">
          <button class="sources" title="查看引用片段">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
            ${resp.sources} 引用
          </button>
          <button class="meta-btn" title="复制" data-act="copy">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          </button>
          <button class="meta-btn" title="重新生成" data-act="regen">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
          </button>
          <button class="meta-btn" title="反馈" data-act="rate">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-1.84-2.3H14z"/><path d="M7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/></svg>
          </button>
        </div>
      </div>
    `;
    div.querySelector('[data-act="copy"]').addEventListener('click', () => showToast('已复制到剪贴板'));
    div.querySelector('[data-act="rate"]').addEventListener('click', e => { e.currentTarget.classList.toggle('on'); });
    div.querySelector('[data-act="regen"]').addEventListener('click', () => showToast('正在重新生成…'));
    div.querySelector('.sources').addEventListener('click', () => showToast('引用面板将在下一版提供'));
    messages.appendChild(div);
    scrollBottom();
  };

  const showThinking = () => {
    const div = document.createElement('div');
    div.className = 'msg ai';
    div.id = 'thinking';
    div.innerHTML = `<div class="msg-avatar">${AI_AVATAR}</div><div class="msg-body"><div class="typing"><span></span><span></span><span></span></div></div>`;
    messages.appendChild(div);
    scrollBottom();
  };

  const setSendEnabled = () => {
    sendBtn.disabled = !input.value.trim();
  };

  const setStopping = (on) => {
    if (on) {
      sendBtn.innerHTML = STOP_ICON;
      sendBtn.classList.add('stop');
    } else {
      sendBtn.innerHTML = SEND_ICON;
      sendBtn.classList.remove('stop');
      setSendEnabled();
    }
  };

  let pending = null;
  const finishThinking = (stopped, resp) => {
    const t = document.getElementById('thinking');
    if (t) t.remove();
    clearTimeout(pending);
    pending = null;
    setStopping(false);
    if (!stopped && resp) {
      appendAI(resp);
      touchHistory();
      updateActiveHistory();
    }
  };

  const send = () => {
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    autoGrow();
    setSendEnabled();
    if (!welcome.hidden) {
      welcome.hidden = true;
      messages.hidden = false;
    }
    appendUser(text);
    showThinking();
    setStopping(true);
    touchHistory();
    updateActiveHistory();
    const resp = pickResponse(text);
    pending = setTimeout(() => finishThinking(false, resp), 1100 + Math.random() * 400);
  };

  input.addEventListener('input', () => { autoGrow(); setSendEnabled(); });
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      if (input.value.trim()) send();
    }
  });
  sendBtn.addEventListener('click', () => {
    if (sendBtn.classList.contains('stop')) {
      finishThinking(true);
    } else if (input.value.trim()) {
      send();
    }
  });
  attachBtn.addEventListener('click', () => showToast('已选文件 — 正在加入本地索引'));
  const newConversation = () => {
    if (!messages.hidden && messages.children.length === 0) {
      closeHistory();
      return;
    }
    messages.innerHTML = '';
    messages.hidden = true;
    welcome.hidden = false;
    input.value = '';
    autoGrow();
    setSendEnabled();
    input.focus({ preventScroll: true });
    historyList.querySelectorAll('.history-item.active').forEach(el => el.classList.remove('active'));
    closeHistory();
  };
  newBtn.addEventListener('click', newConversation);
  newBtnSide.addEventListener('click', newConversation);

  const openHistory = () => { appEl.classList.add('history-open'); };
  const closeHistory = () => { appEl.classList.remove('history-open'); };
  historyToggle.addEventListener('click', openHistory);
  historyClose.addEventListener('click', closeHistory);
  historyScrim.addEventListener('click', closeHistory);

  const titlesFromMessages = () => {
    const firstUser = messages.querySelector('.msg.user .msg-text');
    const text = firstUser ? firstUser.textContent.trim() : '';
    return text || '新对话';
  };
  const updateActiveHistory = () => {
    const items = historyList.querySelectorAll('.history-item');
    items.forEach(el => el.classList.remove('active'));
    const first = items[0];
    if (!first) return;
    first.classList.add('active');
    const title = titlesFromMessages();
    const titleEl = first.querySelector('.history-item-title');
    if (titleEl) titleEl.textContent = title.length > 18 ? title.slice(0, 18) + '…' : title;
    const previewNodes = messages.querySelectorAll('.msg.ai .msg-text');
    if (previewNodes.length) {
      const last = previewNodes[previewNodes.length - 1].textContent.trim().replace(/\s+/g, ' ');
      const pe = first.querySelector('.history-item-preview');
      if (pe) pe.textContent = last.length > 30 ? last.slice(0, 30) + '…' : last;
    }
  };
  const formatNow = () => {
    const d = new Date();
    return d.getHours().toString().padStart(2, '0') + ':' + d.getMinutes().toString().padStart(2, '0');
  };
  const touchHistory = () => {
    const first = historyList.querySelector('.history-item');
    if (!first) return;
    const t = first.querySelector('.history-item-time');
    if (t) t.textContent = formatNow();
  };

  historyList.addEventListener('click', (e) => {
    const item = e.target.closest('.history-item');
    if (!item) return;
    historyList.querySelectorAll('.history-item.active').forEach(el => el.classList.remove('active'));
    item.classList.add('active');
    closeHistory();
    showToast('切换到：' + (item.querySelector('.history-item-title')?.textContent || '对话'));
  });
  document.querySelectorAll('.prompt').forEach(btn => {
    btn.addEventListener('click', () => {
      input.value = btn.dataset.q;
      autoGrow();
      setSendEnabled();
      send();
    });
  });

  window.addEventListener('load', () => { autoGrow(); input.focus({ preventScroll: true }); });
})();
</script>
</body>
</html>
